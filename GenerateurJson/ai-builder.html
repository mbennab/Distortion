<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — Distortion</title>
<style>
:root{
  --bg:#090c10;--panel:#0f141c;--panel2:#141b26;--border:#1e2a3a;--border2:#263445;
  --text:#c8d6e5;--muted:#5a6e85;--muted2:#3d5166;
  --accent:#00e5ff;--accent2:#00e676;--accent3:#ffd740;--red:#ff5252;--orange:#ff9800;
  --purple:#c792ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ─── Header ─── */
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;min-height:40px}
header h1{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.tab-bar{display:flex;gap:1px;margin-left:12px}
.tab-btn{padding:4px 13px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;transition:.15s}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.spacer{flex:1}
.btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);cursor:pointer;font-size:11px;transition:.15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-a{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.btn-a:hover{opacity:.85;color:#000}
.btn-g{background:var(--accent2);color:#000;border-color:var(--accent2);font-weight:700}
.btn-g:hover{opacity:.85;color:#000}
.btn-d{background:#1a3a6a;color:#7ec8e3;border-color:#2a5a9a;font-weight:700}
.btn-d:hover{background:#2a4a8a}
#deployBtn{display:none}

/* ─── Era bar ─── */
.era-bar{display:none;gap:5px;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;flex-wrap:wrap}
.era-bar span{font-size:11px;color:var(--muted);margin-right:4px;font-weight:600}
.era-btn{padding:4px 11px;border-radius:12px;border:1px solid var(--border2);background:var(--panel);color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:.2s;white-space:nowrap}
.era-btn:hover{border-color:var(--accent3);color:var(--accent3)}
.era-btn.hub{border-color:#5a6e85}
.era-btn.moyenage{border-color:#8a6a3a;color:#c8a870}
.era-btn.moyenage:hover{border-color:#ffd740;color:#ffd740}
.era-btn.present{border-color:#5a3a3a;color:#c87870}
.era-btn.present:hover{border-color:#ff5252;color:#ff5252}
.era-btn.futur{border-color:#3a5a8a;color:#70a8c8}
.era-btn.futur:hover{border-color:#00e5ff;color:#00e5ff}
.era-btn.libre{border-color:#5a5a5a;color:var(--muted)}

/* ─── Layout ─── */
.main{display:flex;flex:1;overflow:hidden}

/* ─── Chat ─── */
.chat{width:420px;min-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border)}

/* Test debug bar */
.test-bar{display:none;gap:6px;padding:6px 10px;background:#0a1520;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;flex-shrink:0}
.tb{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tb.neutral{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.tb.ok{background:#0a2e14;color:var(--accent2);border:1px solid #1a5a2a}
.tb.warn{background:#2e1e0a;color:var(--orange);border:1px solid #5a3a0a}
.tb.danger{background:#2e0a0a;color:var(--red);border:1px solid #5a1a0a}
.tb.quest{cursor:pointer;transition:.15s}
.tb.quest:hover{border-color:var(--accent)!important;color:var(--accent)!important}
.tb-sep{color:var(--muted2);font-size:11px}

.chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}

/* Messages */
.msg{max-width:94%;padding:8px 11px;border-radius:7px;font-size:12.5px;line-height:1.55;word-break:break-word}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:2px}
.msg.usr{align-self:flex-end;background:#0c2236;border:1px solid #1a3a55;border-bottom-right-radius:2px}
.msg .lbl{font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:3px;letter-spacing:.5px}
.msg.ai .lbl{color:var(--accent)}.msg.usr .lbl{color:var(--accent3)}
.msg .body{white-space:pre-wrap}
.msg.action-msg{background:#0a1f0a;border-color:#1a5a1a;font-size:11.5px}
.msg.err-msg{background:#1f0a0a;border-color:#5a1a1a}

/* Phase badge inside messages */
.phase-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9.5px;font-weight:700;margin-bottom:4px;background:#0a2030;color:var(--accent);border:1px solid #1a4060}

/* Chat input */
.chat-input{display:flex;gap:5px;padding:6px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
.chat-input input{flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:4px;font-size:13px}
.chat-input input:focus{outline:none;border-color:var(--accent)}
.chat-input input:disabled{opacity:.45;cursor:not-allowed}
#npcSelect{background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:5px 6px;border-radius:4px;font-size:11px;max-width:130px}

/* ─── Preview ─── */
.preview{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.preview-hdr{padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:32px}
.preview-hdr-title{flex:1;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;cursor:pointer;transition:.15s}
.badge.ok{background:#0a2e14;color:var(--accent2);border:1px solid #1a5a2a}
.badge.err{background:#2e0a0a;color:var(--red);border:1px solid #5a1a1a}
.badge.warn{background:#2e1e0a;color:var(--orange);border:1px solid #5a3a1a}
.badge.none{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}

/* View toggle */
.view-tabs{display:flex;gap:1px;border:1px solid var(--border2);border-radius:4px;overflow:hidden;flex-shrink:0}
.view-tab{padding:3px 9px;font-size:10.5px;font-weight:600;cursor:pointer;background:var(--panel2);color:var(--muted);border:none;transition:.15s}
.view-tab.active{background:var(--accent);color:#000}
.view-tab:hover:not(.active){color:var(--text)}

.preview-body{flex:1;overflow:auto;padding:10px;font-size:11.5px}
#jsonView pre{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap}
.j-key{color:#7ec8e3}.j-str{color:#a8d8a8}.j-num{color:#ffd700}.j-bool{color:#ff8c69}.j-null{color:#888}

/* Validation panel */
.val-panel{background:var(--panel2);border-bottom:1px solid var(--border);max-height:160px;overflow-y:auto;font-size:11px;flex-shrink:0}
.val-item{padding:4px 10px;border-bottom:1px solid var(--border);display:flex;gap:7px;align-items:flex-start}
.val-item:last-child{border-bottom:none}
.val-sev{font-weight:700;flex-shrink:0;font-size:9.5px;padding:1px 5px;border-radius:3px}
.val-sev.error{background:#3d0a0a;color:var(--red)}.val-sev.warning{background:#3d2a0a;color:var(--orange)}
.val-msg{color:var(--muted);line-height:1.4}
.val-path{color:var(--muted2);font-size:10px;margin-top:1px}

/* ─── Cards view ─── */
#cardsView{padding:10px;overflow:auto;flex:1}
.dim-meta{padding:10px 12px;border-radius:6px;background:var(--panel);border:1px solid var(--border2);margin-bottom:10px}
.dim-meta .era-tag{font-size:10px;font-weight:700;color:var(--accent3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.dim-meta .dim-name{font-size:15px;font-weight:700;margin-bottom:3px}
.dim-meta .dim-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
.section-hdr{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.npc-card{background:var(--panel);border:1px solid var(--border2);border-radius:6px;margin-bottom:8px;overflow:hidden}
.npc-card-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:8px}
.npc-card-hdr .npc-name{font-weight:700;font-size:13px}
.npc-card-hdr .npc-id{font-size:10px;color:var(--accent);background:#0a2030;padding:1px 6px;border-radius:8px}
.npc-card-body{padding:8px 10px}
.npc-tone{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px;line-height:1.4}
.npc-state{font-size:11px;color:var(--orange);margin-bottom:6px}
.npc-arc{font-size:10.5px;color:var(--muted2);margin-top:5px}
.intents-list{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.intent-row{display:flex;gap:6px;align-items:baseline;font-size:11px;padding:3px 0;border-top:1px solid var(--border)}
.intent-row:first-child{border-top:none}
.intent-id{font-size:9.5px;color:var(--accent);background:#0a2030;padding:1px 5px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.intent-trigger{color:var(--muted);flex:1;line-height:1.4}
.intent-cond{font-size:9.5px;color:var(--muted2);white-space:nowrap}
.intent-action{font-size:9.5px;color:var(--accent2);background:#0a2014;padding:1px 5px;border-radius:6px;white-space:nowrap;font-weight:700}
.quest-card{background:var(--panel);border:1px solid var(--border2);border-radius:6px;margin-bottom:8px;padding:8px 10px}
.quest-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.quest-title{font-weight:700;font-size:12.5px}
.quest-id{font-size:10px;color:var(--purple);background:#1a0a30;padding:1px 6px;border-radius:8px}
.quest-deps{font-size:10.5px;color:var(--muted2);margin-bottom:4px}
.step-row{display:flex;gap:7px;align-items:flex-start;font-size:11px;padding:2px 0;color:var(--muted);line-height:1.4}
.step-num{font-size:9.5px;font-weight:700;color:var(--muted2);flex-shrink:0;padding-top:1px}

/* ─── Empty states ─── */
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:20px}
.empty-inner{max-width:360px}.empty-icon{font-size:34px;margin-bottom:8px}
.empty-inner b{font-size:14px;display:block;margin-bottom:6px}
.empty-inner p{font-size:12px;line-height:1.6;color:var(--muted)}
.import-zone{border:2px dashed var(--border2);border-radius:6px;padding:16px;margin:10px 0;cursor:pointer;transition:.2s;text-align:center;font-size:12px}
.import-zone:hover{border-color:var(--accent);background:rgba(0,229,255,.03)}
.import-zone b{display:block;margin-bottom:3px;color:var(--text)}
.import-zone small{color:var(--muted)}
.import-actions{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}

/* ─── Modal ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:8px;width:440px;max-height:72vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-hdr{padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.modal-hdr button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.modal-hdr button:hover{color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:8px}
.modal-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);padding:8px 10px 4px}
.modal-item{padding:9px 12px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:.15s}
.modal-item:hover{background:var(--panel2);border-color:var(--border2)}
.modal-item strong{display:block;font-size:12.5px;margin-bottom:1px}
.modal-item small{color:var(--muted);font-size:10.5px}
.modal-item .era-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.modal-ftr{padding:8px 14px;border-top:1px solid var(--border);text-align:right}
.modal-empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}

/* ─── Spinner & toast ─── */
.spin{width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:14px;right:14px;padding:7px 13px;border-radius:5px;font-size:12px;z-index:200;animation:fadeUp .25s}
.toast.ok{background:#0a3d1a;color:var(--accent2);border:1px solid var(--accent2)}
.toast.err{background:#3d0a0a;color:var(--red);border:1px solid var(--red)}
.toast.info{background:#0a2030;color:var(--accent);border:1px solid var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:fadeUp .2s}
</style>
</head>
<body>

<header>
  <h1>🧠 AI Studio</h1>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="create" onclick="switchTab('create')">🤖 Créer</button>
    <button class="tab-btn" data-tab="modify" onclick="switchTab('modify')">📝 Modifier</button>
    <button class="tab-btn" data-tab="test" onclick="switchTab('test')">🧪 Tester</button>
  </div>
  <div class="spacer"></div>
  <button id="deployBtn" class="btn btn-d" onclick="deployJSON()" title="Sauver dans le workshop ET dans le dossier du jeu Godot">🚀 Déployer</button>
  <button class="btn btn-g" onclick="saveJSON()" title="Sauver dans le workshop (Ctrl+S)">💾 Sauver</button>
  <button class="btn" onclick="copyJSON()" title="Copier le JSON dans le presse-papier">📋</button>
  <a href="/" class="btn" style="text-decoration:none">← Éditeur</a>
</header>

<!-- Era quick-start bar -->
<div id="eraBar" class="era-bar">
  <span>Démarrer pour :</span>
  <button class="era-btn hub" onclick="quickStart('hub')">🌀 HUB</button>
  <button class="era-btn moyenage" onclick="quickStart('moyenage')">🏰 Moyen Âge</button>
  <button class="era-btn present" onclick="quickStart('present')">☢️ Présent</button>
  <button class="era-btn futur" onclick="quickStart('futur')">🚀 Futur</button>
  <button class="era-btn libre" onclick="enableInput('Décris ton jeu ici...')" title="Décrire librement">✏️ Libre</button>
</div>

<!-- Modal chargement -->
<div id="serverModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr"><span>📂 Charger une dimension</span><button onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"><div class="modal-empty">Chargement...</div></div>
    <div class="modal-ftr"><button class="btn" onclick="closeModal()">Annuler</button></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFileInput(event)">

<div class="main">
  <!-- Chat -->
  <div class="chat">
    <div id="testBar" class="test-bar"></div>
    <div class="chat-msgs" id="msgs"></div>
    <div class="chat-input">
      <select id="npcSelect" style="display:none" onchange="selectNpc()"></select>
      <input type="text" id="userInput" placeholder="Votre message..." disabled
             onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
      <button class="btn btn-a" id="sendBtn" onclick="send()" disabled>→</button>
      <button class="btn" onclick="saveJSON()" title="Sauver (Ctrl+S)">💾</button>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview">
    <div class="preview-hdr">
      <span class="preview-hdr-title" id="previewTitle">Aperçu JSON</span>
      <span id="validBadge" class="badge none" onclick="toggleValPanel()" style="display:none"></span>
      <div class="view-tabs" id="viewTabs" style="display:none">
        <button class="view-tab active" onclick="switchView('json')">JSON</button>
        <button class="view-tab" onclick="switchView('cards')">Fiches</button>
      </div>
    </div>
    <div id="valPanel" class="val-panel" style="display:none"></div>
    <div id="jsonView" class="preview-body"><div class="empty"><div class="empty-inner"><div class="empty-icon">📄</div><p>Le JSON apparaîtra ici au fur et à mesure.</p></div></div></div>
    <div id="cardsView" style="display:none"></div>
  </div>
</div>

<script>
// ─── Pitches ères ─────────────────────────────────────────────────────
const ERA_PITCHES = {
  hub: `HUB Central pour le jeu Distortion. Le nexus temporel hors du temps. Un Gardien mystérieux et enigmatique veille sur les 3 portails (jaune/MoyenAge, bleu/Present, rouge/Futur). Ambiance mystique. Le Gardien guide le joueur vers les ères sans trop dévoiler. Pas de quête dans le HUB, le Gardien oriente juste. ID de dimension : hub.`,
  moyenage: `Moyen Âge pour le jeu Distortion. Château fort médiéval. La dimension contient déjà le roi mourant (npc_roi_moyenage avec action roi_adieu). Je veux créer une dimension complémentaire ou enrichir l'existant. Dis-moi ce que tu proposes : ajouter des PNJ (marchand, chevalier, geôlier) ou construire une nouvelle sous-dimension. ID : moyenage.`,
  present: `Présent/Nucléaire pour le jeu Distortion. Monde post-apocalyptique 2087. Les ruines radioactives, des bunkers rouillés. La dimension_nuclear.json dans le workshop a déjà 3 PNJ (Dr Hélène Vasseur, Colonel Bravo, Zak l'Écumeur) et 3 quêtes. Je veux créer une nouvelle dimension pour ce Present dans le jeu, avec de nouveaux PNJ et quêtes. ID : nuclear.`,
  futur: `Futur pour le jeu Distortion. Cité hi-tech futuriste. Le pnj_futur.gd existe mais est visuel uniquement, sans dialogue. Je veux créer la PREMIÈRE dimension avec IA pour cette ère. Sous-sol accessible par escalier, androïdes, technologies avancées, inégalités sociales. Propose des PNJ et quêtes cohérents. ID : futur.`,
};

// ─── État ────────────────────────────────────────────────────────────
let mode = 'create';
let history = [];
let testHistory = [];
let currentData = null;
let currentDim = null;  // persiste entre les onglets
let currentNpc = null;
let processing = false;
let isDone = false;
let msgCount = 0;
let activeIntentions = 0;
let testGameState = {};  // {quest_id: {status, current_step}}
let valPanelOpen = false;
let previewView = 'json';

// ─── Onglets ─────────────────────────────────────────────────────────
function switchTab(m) {
  if (processing) return;
  mode = m;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === m));

  clearConversation();
  document.getElementById('npcSelect').style.display = 'none';
  document.getElementById('eraBar').style.display = 'none';
  document.getElementById('testBar').style.display = 'none';

  if (m === 'create') {
    document.getElementById('eraBar').style.display = 'flex';
    setPreviewTitle('Aperçu JSON');
    updatePreview(currentData);
    addMsg('ai', 'Décris ton jeu librement, ou clique sur une ère ci-dessus pour un démarrage rapide.');
    // Pas encore d'input — l'ère ou le bouton "Libre" l'active
  } else if (m === 'modify') {
    setPreviewTitle('Aperçu JSON');
    if (currentDim) loadModifyMode(); else showImportArea();
  } else if (m === 'test') {
    setPreviewTitle('Contexte PNJ');
    if (currentDim) loadTestMode(); else showImportArea();
  }
}

function clearConversation() {
  history = [];
  testHistory = [];
  isDone = false;
  msgCount = 0;
  activeIntentions = 0;
  currentNpc = null;
  testGameState = {};
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
}

// ─── Import / Chargement ─────────────────────────────────────────────
function showImportArea() {
  document.getElementById('msgs').innerHTML = `
    <div class="empty"><div class="empty-inner">
      <div class="empty-icon">📂</div>
      <b>Charger une dimension</b>
      <p>Importe un fichier JSON ou charge depuis le serveur pour commencer.</p>
      <div class="import-zone" onclick="document.getElementById('fileInput').click()">
        <b>Cliquer pour importer un JSON</b>
        <small>ou glisser-déposer ici</small>
      </div>
      <div class="import-actions">
        <button class="btn" onclick="openServerModal()">🗄️ Dimensions du serveur</button>
      </div>
    </div></div>`;
  updatePreview(null);
}

function handleFileInput(e) {
  const file = e.target.files[0];
  if (file) loadFile(file);
  e.target.value = '';
}

async function loadFile(file) {
  try {
    const dim = JSON.parse(await file.text());
    applyLoadedDim(dim, file.name);
  } catch(e) { toast('JSON invalide : ' + e.message, 'err'); }
}

function applyLoadedDim(dim, source) {
  currentDim = dim;
  currentData = JSON.parse(JSON.stringify(dim));
  updatePreview(currentData);
  clearConversation();
  const name = dim.meta?.name || dim.meta?.id || source || '?';
  if (mode === 'modify') {
    loadModifyMode();
  } else if (mode === 'test') {
    loadTestMode();
  } else {
    addMsg('ai', `✓ "${name}" chargée.`);
    enableInput('Décris les modifications...');
  }
  updateDeployBtn(dim);
}

  body.innerHTML = '<div class="modal-empty">Chargement...</div>';

// ─── Modes ────────────────────────────────────────────────────────────
function loadModifyMode() {
  document.getElementById('msgs').innerHTML = '';
  const name = currentDim?.meta?.name || currentDim?.meta?.id || '?';
  addMsg('ai', `"${name}" chargée. Que veux-tu modifier ?\n(PNJ, quête, intentions, dialogues, ton, fallbacks...)`);
  enableInput('Que veux-tu modifier ?');
  updatePreview(currentData);
}

function loadTestMode() {
  document.getElementById('msgs').innerHTML = '';
  const npcs = currentDim?.npcs || [];
  if (!npcs.length) {
    addMsg('ai', 'Cette dimension ne contient aucun PNJ.'); return;
  }
  const sel = document.getElementById('npcSelect');
  sel.style.display = 'block';
  sel.innerHTML = '<option value="">— Choisir un PNJ —</option>' +
    npcs.map(n => `<option value="${esc(n.id)}">${esc(n.name||n.id)}</option>`).join('');

  // Initialiser l'état des quêtes depuis la dimension
  testGameState = {};
  for (const q of currentDim?.quests || []) {
    const steps = q.steps || [];
    testGameState[q.id] = {status: q.status || 'not_started', current_step: steps[0]?.id || null};
  }

  addMsg('ai', `${npcs.length} PNJ disponible${npcs.length>1?'s':''}. Sélectionne un PNJ pour commencer.`);
  setPreviewTitle('Contexte PNJ');
  updatePreview(null);
}

function selectNpc() {
  const id = document.getElementById('npcSelect').value;
  if (!id) { currentNpc = null; disableInput(); return; }
  currentNpc = (currentDim?.npcs || []).find(n => n.id === id);
  if (!currentNpc) return;
  testHistory = [];
  msgCount = 0;
  activeIntentions = 0;
  isDone = false;
  document.getElementById('msgs').innerHTML = '';
  addMsg('ai', `Tu parles maintenant avec ${currentNpc.name||id}. Commence !`);
  enableInput(`Parler à ${currentNpc.name||id}...`);
  showNpcContext(currentNpc);
  updateTestBar();
}

function showNpcContext(npc) {
  const p = npc.personality || {};
  const s = p.speech || {};
  const arcStr = (p.conversation_arc||[]).map(a=>`msg≤${a.until_message}: ${a.focus}`).join('\n');
  const intStr = (npc.intentions||[]).map(i=>
    `  [${i.id}]${i.condition?.quest_id?' (cond)':''} ${i.trigger||''}${i.action?' ⚡':''}`
  ).join('\n');
  const ctx = [
    `## ${npc.name} [${npc.id}]`,
    p.tone ? `Tone: ${p.tone}` : '',
    p.emotional_state ? `État: ${p.emotional_state}` : '',
    p.backstory ? `Backstory: ${p.backstory}` : '',
    `Parole: ${s.vouvoiement?'vouvoiement':'tutoiement'}${s.vocatif?`, "${s.vocatif}"`:''}`,
    s.phrases ? `Style: ${s.phrases}` : '',
    s.expressions?.length ? `Expr: ${s.expressions.join(' | ')}` : '',
    s.interdits?.length ? `Interdits: ${s.interdits.join(' | ')}` : '',
    p.knowledge?.length ? `\nSait:\n${p.knowledge.map(k=>'  • '+k).join('\n')}` : '',
    p.goals?.length ? `\nObjectifs:\n${p.goals.map(g=>'  • '+g).join('\n')}` : '',
    arcStr ? `\nArc:\n${arcStr}` : '',
    intStr ? `\nIntentions:\n${intStr}` : '',
  ].filter(Boolean).join('\n');
  document.getElementById('jsonView').innerHTML = '<pre>'+esc(ctx)+'</pre>';
  setPreviewTitle(`Contexte — ${npc.name||npc.id}`);
  clearValidation();
  document.getElementById('viewTabs').style.display = 'none';
}

// ─── Test debug bar ──────────────────────────────────────────────────
function updateTestBar() {
  const bar = document.getElementById('testBar');
  if (mode !== 'test' || !currentNpc) { bar.style.display='none'; return; }
  bar.style.display = 'flex';

  const MAX = 5;
  const remaining = Math.max(0, MAX - msgCount);
  const hasAction = (currentNpc.intentions||[]).some(i => i.action?.type === 'trigger');

  const msgCls = msgCount >= MAX ? 'danger' : msgCount >= 4 ? 'warn' : 'neutral';
  const actCls = hasAction ? (remaining <= 1 ? 'danger' : remaining <= 2 ? 'warn' : 'ok') : 'neutral';
  const intCls = activeIntentions === 0 ? 'warn' : 'ok';

  let html = `
    <span class="tb ${msgCls}">💬 ${msgCount}/${MAX}</span>
    ${hasAction ? `<span class="tb ${actCls}">⚡ action dans ${remaining}</span>` : ''}
    <span class="tb ${intCls}">🎯 ${activeIntentions} intentions</span>`;

  const quests = currentDim?.quests || [];
  if (quests.length) {
    html += '<span class="tb-sep">|</span>';
    for (const q of quests) {
      const gs = testGameState[q.id] || {status:'not_started', current_step:null};
      const steps = q.steps || [];
      let label, cls;
      if (gs.status === 'done') { label='✓'; cls='ok'; }
      else if (gs.current_step) {
        const idx = steps.findIndex(s=>s.id===gs.current_step);
        label = `${idx+1}/${steps.length}`; cls='warn';
      } else { label='○'; cls='neutral'; }
      const shortId = q.id.replace(/^quete?_/,'');
      html += `<span class="tb quest ${cls}" onclick="cycleQuestState('${esc(q.id)}')" title="Clic = changer l'état · ${esc(q.title||q.id)}">${esc(shortId)}: ${label}</span>`;
    }
  }

  bar.innerHTML = html;
}

function cycleQuestState(questId) {
  const quest = (currentDim?.quests||[]).find(q=>q.id===questId);
  if (!quest) return;
  const steps = quest.steps || [];
  const gs = testGameState[questId] || {status:'not_started', current_step:steps[0]?.id||null};

  if (gs.status === 'done') {
    testGameState[questId] = {status:'not_started', current_step:steps[0]?.id||null};
  } else {
    const idx = steps.findIndex(s=>s.id===gs.current_step);
    if (idx < 0 || idx >= steps.length-1) {
      testGameState[questId] = {status:'done', current_step:null};
    } else {
      testGameState[questId] = {status:'not_started', current_step:steps[idx+1].id};
    }
  }

  testHistory = [];
  msgCount = 0;
  activeIntentions = 0;
  document.getElementById('msgs').innerHTML = '';
  addMsg('ai', `État de "${quest.title||questId}" mis à jour. Conversation réinitialisée.`);
  updateTestBar();
}

// ─── Envoi ────────────────────────────────────────────────────────────
async function send() {
  if (processing || isDone) return;
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  disableInput();
  if (mode === 'test' && currentNpc) { await sendTest(text); }
  else {
    history.push({role:'user', content:text});
    addMsg('usr', text);
    await sendAI(text);
  }
  if (!isDone) enableInput();
}

async function sendAI(msg) {
  processing = true;
  const spinner = addMsg('ai', '<span class="spin"></span> Réflexion...', true);
  const endpoint = mode === 'modify' ? '/api/ai-modify' : '/api/ai-build';
  const body = mode === 'modify'
    ? {dimension:currentDim, messages:history.slice(-28), user_message:msg}
    : {messages:history.slice(-28), user_message:msg};
  try {
    const r = await fetch(endpoint, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    spinner.remove();
    if (!r.ok) { const e=await r.json(); addMsg('ai','❌ '+(e.detail||'Erreur API'),false,'err-msg'); processing=false; return; }
    const res = await r.json();
    addMsg('ai', res.text);
    history.push({role:'assistant', content:JSON.stringify({text:res.text,data:res.data,done:res.done})});
    if (res.data && Object.keys(res.data).length > 0) {
      currentData = res.data;
      if (mode === 'modify') { currentDim = res.data; updateDeployBtn(res.data); }
      updatePreview(res.data);
      autosave(res.data);
    }
    if (res.done) {
      isDone = true;
      updateDeployBtn(currentData);
      addMsg('ai', '✅ Dimension complète ! Clique sur 💾 Sauver ou 🚀 Déployer.', false, 'action-msg');
    }
  } catch(e) { spinner.remove(); addMsg('ai','❌ '+e.message,false,'err-msg'); }
  processing = false;
}

async function sendTest(msg) {
  processing = true; msgCount++;
  addMsg('usr', msg);
  const spinner = addMsg('ai','<span class="spin"></span> ...',true);
  testHistory.push({role:'player', text:msg});
  try {
    const r = await fetch('/api/ai-test', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        dimension: currentDim, npc_id: currentNpc.id,
        history: testHistory.slice(-15),
        game_state: testGameState,
        user_message: msg, msg_count: msgCount
      })
    });
    spinner.remove();
    if (!r.ok) { const e=await r.json(); addMsg('ai','❌ '+(e.detail||'Erreur API'),false,'err-msg'); processing=false; updateTestBar(); return; }
    const res = await r.json();
    addMsg('ai', res.text);
    testHistory.push({role:'npc', text:res.text});
    activeIntentions = res.active_intentions ?? activeIntentions;
    if (res.action) addMsg('ai', `⚡ Action déclenchée : ${res.action.type}/${res.action.id}`, false, 'action-msg');
  } catch(e) { spinner.remove(); addMsg('ai','❌ '+e.message,false,'err-msg'); }
  processing = false;
  updateTestBar();
}

async function saveJSON() {
  const data = currentData || currentDim;
  if (!data) { toast('Rien à sauvegarder.','err'); return; }
  const id = data.meta?.id;
  if (!id) { toast('Le JSON doit avoir meta.id.','err'); return; }
  try {
    const r = await fetch(`/api/dimensions/${id}`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if (!r.ok) throw new Error('Échec');
    toast(`✓ Sauvegardé : dimension_${id}.json`,'ok');
  } catch(e) { toast('Erreur : '+e.message,'err'); }
}

async function deployJSON() {
  const data = currentData || currentDim;
  if (!data) { toast('Rien à déployer.','err'); return; }
  const id = data.meta?.id;
  if (!id) { toast('Le JSON doit avoir meta.id.','err'); return; }
  try {
    const r = await fetch(`/api/dimensions/${id}/deploy`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if (!r.ok) throw new Error('Échec');
    const res = await r.json();
    if (res.deployed) {
      toast(`🚀 Déployé dans le jeu : ${res.game_path?.split('/').slice(-2).join('/')}`, 'ok');
    } else {
      toast(`💾 Sauvé dans le workshop. (ID "${id}" non reconnu comme ère du jeu)`, 'info');
    }
  } catch(e) { toast('Erreur : '+e.message,'err'); }
}

async function copyJSON() {
  const data = currentData || currentDim;
  if (!data) { toast('Rien à copier.','err'); return; }
  try {
    await navigator.clipboard.writeText(JSON.stringify(data, null, 2));
    toast('JSON copié dans le presse-papier.','ok');
  } catch(e) { toast('Copie impossible : '+e.message,'err'); }
}

function updateDeployBtn(data) {
  const btn = document.getElementById('deployBtn');
  const knownIds = ['hub','moyenage','nuclear','futur'];
  btn.style.display = (data?.meta?.id && knownIds.includes(data.meta.id)) ? '' : 'none';

function loadDraft() {

// ─── Preview & Validation ─────────────────────────────────────────────
function updatePreview(data) {
  const hasData = data && Object.keys(data).length > 0;
  document.getElementById('viewTabs').style.display = hasData ? '' : 'none';

  if (!hasData) {
    document.getElementById('jsonView').innerHTML = '<div class="empty"><div class="empty-inner"><div class="empty-icon">📄</div><p>Le JSON apparaîtra ici.</p></div></div>';
    document.getElementById('cardsView').innerHTML = '';
    clearValidation();
    return;
  }
  const n=(data.npcs||[]).length, q=(data.quests||[]).length;
  setPreviewTitle(`${n} PNJ · ${q} quête${q!==1?'s':''}`);

  if (previewView === 'json') {
    document.getElementById('jsonView').innerHTML = '<pre>'+highlightJSON(JSON.stringify(data,null,2))+'</pre>';
  } else {
    document.getElementById('cardsView').innerHTML = renderCards(data);
  }
  validateData(data);
}

function switchView(v) {
  previewView = v;
  document.querySelectorAll('.view-tab').forEach((t,i) => t.classList.toggle('active', ['json','cards'][i]===v));
  document.getElementById('jsonView').style.display = v==='json' ? '' : 'none';
  document.getElementById('cardsView').style.display = v==='cards' ? '' : 'none';
  if (currentData) updatePreview(currentData);
}

// ─── Rendu Fiches ─────────────────────────────────────────────────────
function renderCards(data) {
  const m = data.meta || {};
  let html = '';

  if (m.name || m.era) {
    html += `<div class="dim-meta">
      ${m.era?`<div class="era-tag">${esc(m.era)}</div>`:''}
      <div class="dim-name">${esc(m.name||m.id||'?')}</div>
      ${m.description?`<div class="dim-desc">${esc(m.description)}</div>`:''}
    </div>`;
  }

  const npcs = data.npcs || [];
  if (npcs.length) {
    html += `<div class="section-hdr">PNJ (${npcs.length})</div>`;
    for (const npc of npcs) {
      const p = npc.personality || {};
      const s = p.speech || {};
      const arc = (p.conversation_arc||[]).map(a=>`msg≤${a.until_message}`).join(' → ');
      const intents = (npc.intentions||[]).map(i => {
        const cond = i.condition?.quest_id ? `<span class="intent-cond">${esc(i.condition.quest_id)}</span>` : '';
        const act = i.action ? `<span class="intent-action">⚡ ${esc(i.action.id)}</span>` : '';
        return `<div class="intent-row">
          <span class="intent-id">${esc(i.id)}</span>
          <span class="intent-trigger">${esc(i.trigger||'')}</span>
          ${cond}${act}
        </div>`;
      }).join('');
      html += `<div class="npc-card">
        <div class="npc-card-hdr">
          <span class="npc-name">${esc(npc.name||npc.id)}</span>
          <span class="npc-id">${esc(npc.id)}</span>
        </div>
        <div class="npc-card-body">
          ${p.tone?`<div class="npc-tone">${esc(p.tone)}</div>`:''}
          ${p.emotional_state?`<div class="npc-state">⚡ ${esc(p.emotional_state)}</div>`:''}
          ${intents?`<div class="intents-list">${intents}</div>`:''}
          ${arc?`<div class="npc-arc">Arc : ${esc(arc)}</div>`:''}
        </div>
      </div>`;
    }
  }

  const quests = data.quests || [];
  if (quests.length) {
    html += `<div class="section-hdr">Quêtes (${quests.length})</div>`;
    for (const q of quests) {
      const deps = (q.requires_quests||[]).join(', ');
      const stps = (q.steps||[]).map((s,i)=>`<div class="step-row"><span class="step-num">${i+1}.</span>${esc(s.description||s.id)}</div>`).join('');
      html += `<div class="quest-card">
        <div class="quest-hdr"><span class="quest-title">${esc(q.title||q.id)}</span><span class="quest-id">${esc(q.id)}</span></div>
        ${deps?`<div class="quest-deps">Prérequis : ${esc(deps)}</div>`:''}
        ${stps}
      </div>`;
    }
  }

  return html || '<div class="empty"><div class="empty-inner"><p>Aucun contenu à afficher.</p></div></div>';
}

// ─── Validation live ──────────────────────────────────────────────────
async function validateData(data) {
  try {
    const r = await fetch('/api/dimensions/validate', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    showValidation((await r.json()).anomalies || []);
  } catch(e) { clearValidation(); }
}

function showValidation(anomalies) {
  const badge = document.getElementById('validBadge');
  const panel = document.getElementById('valPanel');
  badge.style.display = '';
  const errors = anomalies.filter(a=>a.severity==='error');
  const warns = anomalies.filter(a=>a.severity==='warning');
  if (!anomalies.length) {
    badge.textContent = '✓ Valide'; badge.className = 'badge ok';
    panel.style.display = 'none'; panel.innerHTML = '';
    valPanelOpen = false; return;
  }
  const parts = [];
  if (errors.length) parts.push(`${errors.length} erreur${errors.length>1?'s':''}`);
  if (warns.length) parts.push(`${warns.length} alerte${warns.length>1?'s':''}`);
  badge.textContent = (errors.length?'✗ ':'⚠ ') + parts.join(', ');
  badge.className = 'badge '+(errors.length?'err':'warn');
  panel.innerHTML = anomalies.map(a=>`
    <div class="val-item">
      <span class="val-sev ${a.severity}">${a.severity==='error'?'ERR':'WARN'}</span>
      <div><div class="val-msg">${esc(a.message)}</div>${a.path?`<div class="val-path">${esc(a.path)}</div>`:''}</div>
    </div>`).join('');
  if (valPanelOpen) panel.style.display = '';
}

function clearValidation() {
  document.getElementById('validBadge').style.display = 'none';
  document.getElementById('valPanel').style.display = 'none';
  document.getElementById('valPanel').innerHTML = '';
  valPanelOpen = false;
}

function toggleValPanel() {
  const panel = document.getElementById('valPanel');
  if (!panel.innerHTML) return;
  valPanelOpen = !valPanelOpen;
  panel.style.display = valPanelOpen ? '' : 'none';
}

// ─── Syntax highlight JSON ────────────────────────────────────────────
function highlightJSON(str) {
  return str
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(
      /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      m => {
        let cls='num';
        if(/^"/.test(m)){cls=/:$/.test(m)?'key':'str';}
        else if(/true|false/.test(m)){cls='bool';}
        else if(/null/.test(m)){cls='null';}
        return `<span class="j-${cls}">${m}</span>`;
      }
    );
}

// ─── UI helpers ───────────────────────────────────────────────────────
function addMsg(role, text, isHtml=false, extraClass='') {
  const d = document.createElement('div');
  d.className = 'msg '+(role==='usr'?'usr':'ai')+(extraClass?' '+extraClass:'');
  d.innerHTML = `<div class="lbl">${role==='ai'?'Assistant':'Vous'}</div><div class="body">${isHtml?text:esc(text)}</div>`;
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});
  return d;
}

function setPreviewTitle(t) { document.getElementById('previewTitle').textContent = t; }

function enableInput(placeholder) {
  const inp = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  inp.disabled = false; btn.disabled = false;
  if (placeholder) inp.placeholder = placeholder;
  inp.focus();
}

function disableInput() {
  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Drag & drop ──────────────────────────────────────────────────────
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e=>{
  e.preventDefault();
  const file=[...(e.dataTransfer.files||[])].find(f=>f.name.endsWith('.json'));
  if(file) loadFile(file);
});

// ─── Keyboard shortcuts ───────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveJSON();}
});

// ─── Init ─────────────────────────────────────────────────────────────
switchTab('create');
loadDraft();
</script>
</body>
</html>
