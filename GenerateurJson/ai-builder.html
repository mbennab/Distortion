<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — Distortion</title>
<style>
:root{--bg:#090c10;--panel:#11161e;--border:#1e2a3a;--text:#c8d6e5;--muted:#5a6e85;--accent:#00e5ff;--accent2:#00e676;--accent3:#ffd740;--red:#ff5252}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:var(--accent)}
.tab-bar{display:flex;gap:2px;margin-left:20px}
.tab-btn{padding:6px 16px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;transition:.2s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.spacer{flex:1}
.btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:11px;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-a{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn-a:hover{opacity:.85}
.btn-g{background:var(--accent2);color:#000;border-color:var(--accent2)}
.btn-g:hover{opacity:.85}
.main{display:flex;flex:1;overflow:hidden}
/* Chat */
.chat{flex:1;display:flex;flex-direction:column;min-width:280px;border-right:1px solid var(--border)}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:92%;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat-msg.ai{align-self:flex-start;background:var(--panel);border-bottom-left-radius:2px}
.chat-msg.usr{align-self:flex-end;background:#0d2b3f;border-bottom-right-radius:2px}
.chat-msg .r{font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:3px;letter-spacing:.5px}
.chat-msg.ai .r{color:var(--accent)}.chat-msg.usr .r{color:var(--accent3)}
.chat-input{display:flex;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--border)}
.chat-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-size:13px}
.chat-input input:focus{outline:none;border-color:var(--accent)}
.chat-input select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:11px;max-width:150px}
/* Preview */
.preview{flex:1;min-width:320px;display:flex;flex-direction:column;background:var(--bg)}
.preview-h{padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.preview-body{flex:1;overflow:auto;padding:10px}
.preview-body pre{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;margin:0;white-space:pre-wrap}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.empty-inner{max-width:320px}.empty-icon{font-size:36px;margin-bottom:10px}
/* Import area */
.import-area{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;margin:10px 0;cursor:pointer;transition:.2s}
.import-area:hover{border-color:var(--accent);background:rgba(0,229,255,.02)}
/* Toast */
.toast{position:fixed;bottom:16px;right:16px;padding:8px 14px;border-radius:6px;font-size:12px;z-index:1000;animation:fade .3s}
.toast.ok{background:#0a3d1a;color:var(--accent2);border:1px solid var(--accent2)}
.toast.err{background:#3d0a0a;color:var(--red);border:1px solid var(--red)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg{animation:fade .25s}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-row{display:flex;gap:6px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--border);align-items:center;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>🧠 AI Studio</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('create')">🤖 Créer</button>
    <button class="tab-btn" onclick="switchTab('modify')">📝 Modifier</button>
    <button class="tab-btn" onclick="switchTab('test')">🧪 Tester</button>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-a" onclick="saveJSON()">💾 Sauver</button>
  <a href="/" class="btn" style="text-decoration:none">← Éditeur</a>
</header>

<div class="main">
  <div class="chat">
    <div class="chat-msgs" id="msgs">
      <div class="empty"><div class="empty-inner"><div class="empty-icon">🧠</div><div><b>Brainstorm mode</b></div><div style="font-size:12px">Decris ton jeu librement. L'IA structure tout automatiquement :<br>setting → PNJ → quetes → relations.<br><br>Ex: "Jeu medieval, un roi se fait assassiner..."</div></div></div>
    </div>
    <div class="chat-input">
      <select id="npcSelect" style="display:none"></select>
      <input type="text" id="userInput" placeholder="Votre message..." onkeydown="if(event.key==='Enter')send()" disabled>
      <button class="btn btn-a" id="sendBtn" onclick="send()" disabled>→</button>
      <button class="btn" onclick="saveJSON()" title="Sauver">💾</button>
    </div>
  </div>

  <div class="preview">
    <div class="preview-h" id="previewH">📄 Apercu JSON</div>
    <div class="preview-body" id="previewB"><div class="empty">Le JSON apparaitra ici</div></div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">

<script>
// ─── State ───────────────────────────────────────────────────────
let mode = 'create';  // create | modify | test
let history = [];     // {role, content}
let currentData = null;
let currentDim = null; // pour modify/test
let currentNpc = null;
let processing = false;
let done = false;
let msgCount = 0;

// ─── Tab switching ──────────────────────────────────────────────
function switchTab(m) {
  mode = m;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['create','modify','test'][i]===m));
  reset();
  const sel = document.getElementById('npcSelect');
  const inp = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  sel.style.display = 'none';
  inp.placeholder = 'Votre message...';

  if (m === 'create') {
    setPreviewTitle('Apercu JSON');
    updatePreview(null);
    addMsg('ai', "Decris ton jeu librement (setting, persos, quetes, ambiance...). Je structure tout.", false);
    inp.disabled = false;
    btn.disabled = false;
    inp.placeholder = 'Decris ton jeu ici...';
    inp.focus();
  } else if (m === 'modify') {
    setPreviewTitle('Apercu JSON');
    if (currentDim) { loadModifyMode(); }
    else { showImportArea(); }
  } else if (m === 'test') {
    setPreviewTitle('Contexte PNJ');
    if (currentDim) { loadTestMode(); }
    else { showImportArea(); }
  }
}

function reset() {
  history = []; currentData = null; currentNpc = null; done = false; msgCount = 0;
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  updatePreview(null);
}

function showImportArea() {
  const msgs = document.getElementById('msgs');
  msgs.innerHTML = `<div class="empty"><div class="empty-inner">
    <div class="empty-icon">📂</div>
    <div>Importer une dimension JSON pour commencer.</div>
    <div class="import-area" onclick="document.getElementById('fileInput').click()">
      Cliquez pour importer un JSON<br><small style="color:var(--muted)">ou glissez-deposez</small>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted)">
      <a href="#" onclick="loadFromServer()" style="color:var(--accent)">Charger depuis le serveur</a>
    </div>
  </div></div>`;
}

async function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    currentDim = JSON.parse(text);
    currentData = JSON.parse(text);
    updatePreview(currentData);
    addMsg('ai', 'Dimension importee: ' + (currentDim.meta?.name||'?') + '. Pret.', false);
    document.getElementById('userInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    if (mode === 'modify') loadModifyMode();
    if (mode === 'test') loadTestMode();
    document.getElementById('userInput').focus();
  } catch(e) { alert('JSON invalide: '+e.message); }
}

async function loadFromServer() {
  const resp = await fetch('/api/dimensions');
  const dims = await resp.json();
  if (!dims.length) { alert('Aucune dimension sur le serveur.'); return; }
  const names = dims.map((d,i) => `${i+1}. ${d.id||'?'} - ${d.name||'?'}`).join('\n');
  const choice = prompt('Choisir (numero):\n'+names);
  if (!choice) return;
  const idx = parseInt(choice)-1;
  if (idx < 0 || idx >= dims.length) return;
  const r = await fetch(`/api/dimensions/${dims[idx].id}`);
  currentDim = await r.json();
  currentData = JSON.parse(JSON.stringify(currentDim));
  updatePreview(currentData);
  addMsg('ai', 'Dimension chargee: '+dims[idx].id);
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  if (mode === 'modify') loadModifyMode();
  if (mode === 'test') loadTestMode();
  document.getElementById('userInput').focus();
}

function loadModifyMode() {
  const msgs = document.getElementById('msgs');
  msgs.innerHTML = '';
  addMsg('ai', 'Dimension chargee: '+(currentDim.meta?.name||'?')+'. Que veux-tu modifier ?', false);
  document.getElementById('userInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  setPreviewTitle('Apercu JSON');
  updatePreview(currentData);
}

function loadTestMode() {
  const msgs = document.getElementById('msgs');
  msgs.innerHTML = '';
  const sel = document.getElementById('npcSelect');
  sel.style.display = 'block';
  sel.innerHTML = '<option value="">-- PNJ --</option>' +
    (currentDim.npcs||[]).map(n => `<option value="${n.id}">${n.name||n.id}</option>`).join('');
  sel.onchange = selectNpc;
  addMsg('ai', 'Selectionne un PNJ pour commencer a parler.', false);
  document.getElementById('userInput').placeholder = 'Parler au PNJ...';
  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  setPreviewTitle('Contexte PNJ');
  updatePreview(null);
}

function selectNpc() {
  const sel = document.getElementById('npcSelect');
  const id = sel.value;
  if (!id) { currentNpc = null; return; }
  currentNpc = (currentDim.npcs||[]).find(n => n.id === id);
  if (currentNpc) {
    document.getElementById('userInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('userInput').focus();
    addMsg('ai', `Parle a ${currentNpc.name||id}.`, false);
    // Show NPC context in preview
    const p = currentNpc.personality||{};
    const s = p.speech||{};
    const ctx = [
      `## ${currentNpc.name} [${currentNpc.id}]`,
      `Tone: ${p.tone||''}`,
      `Etat: ${p.emotional_state||''}`,
      `Parle: ${s.vouvoiement?'vouvoiement':'tutoiement'}, ${s.vocatif||''}, ${s.phrases||''}`,
      '', '### Intentions:',
      ...((currentNpc.intentions||[]).map(i => `- [${i.id}] ${i.trigger||''}${i.action?' ⚡':''}`))
    ].join('\n');
    document.getElementById('previewB').innerHTML = '<pre>'+esc(ctx)+'</pre>';
    setPreviewTitle('Contexte PNJ');
    reset();
    document.getElementById('userInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('userInput').focus();
  }
}

// ─── Send ────────────────────────────────────────────────────────
async function send() {
  if (processing || done) return;
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.disabled = true;
  document.getElementById('sendBtn').disabled = true;

  if (mode === 'test' && currentNpc) {
    await sendTest(text);
  } else {
    history.push({role:'user', content:text});
    addMsg('usr', text);
    await sendAI(text);
  }
  if (!done) { inp.disabled = false; document.getElementById('sendBtn').disabled = false; inp.focus(); }
}

async function sendAI(msg) {
  processing = true; msgCount++;
  addMsg('ai', '<span class="spin"></span> ...', true);
  const endpoint = mode === 'modify' ? '/api/ai-modify' : '/api/ai-build';
  const body = mode === 'modify'
    ? {dimension: currentDim, messages: history, user_message: msg}
    : {messages: history, user_message: msg};

  try {
    const r = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail||'API error'); }
    const res = await r.json();
    document.getElementById('msgs').removeChild(document.getElementById('msgs').lastChild);
    addMsg('ai', res.text);
    history.push({role:'assistant', content: JSON.stringify({text:res.text,data:res.data,done:res.done})});
    if (res.data && Object.keys(res.data).length > 0) {
      currentData = res.data;
      if (mode !== 'test') updatePreview(res.data);
    }
    if (res.done) { done = true; addMsg('ai', '✅ Termine. Clique 💾 pour sauver.'); }
  } catch(e) {
    document.getElementById('msgs').removeChild(document.getElementById('msgs').lastChild);
    addMsg('ai', '❌ '+e.message);
  }
  processing = false;
}

async function sendTest(msg) {
  processing = true; msgCount++;
  addMsg('usr', msg);
  addMsg('ai', '<span class="spin"></span> ...', true);

  const testHistory = history.filter(h => h.role==='user'||h.role==='assistant')
    .map(h => ({role: h.role==='player'?'player':'npc', text: h.content.split('"text":"')[1]?.split('"')[0]||''}));
  history.push({role:'user', content:msg});

  try {
    const r = await fetch('/api/ai-test', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        dimension: currentDim, npc_id: currentNpc.id,
        messages: [{role:'user',content:msg}], // use clean history
        history: history.filter(h => h.role==='user'||h.role==='npc').map(h => ({
          role: h.role==='user'?'player':'npc', text: h.content
        })),
        user_message: msg, msg_count: msgCount
      })
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail||'API error'); }
    const res = await r.json();
    document.getElementById('msgs').removeChild(document.getElementById('msgs').lastChild);
    addMsg('ai', res.text);
    if (res.action) { addMsg('ai', '⚡ Action: '+res.action.type+'/'+res.action.id); }
  } catch(e) {
    document.getElementById('msgs').removeChild(document.getElementById('msgs').lastChild);
    addMsg('ai', '❌ '+e.message);
  }
  processing = false;
}

// ─── UI helpers ──────────────────────────────────────────────────
function addMsg(role, text, html=false) {
  const d = document.createElement('div');
  d.className = 'chat-msg '+(role==='usr'?'usr':'ai');
  const lbl = role==='ai'?'Assistant':role==='usr'?'Vous':'';
  d.innerHTML = `<div class="r">${lbl}</div>${html?text:esc(text)}`;
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function updatePreview(data) {
  const b = document.getElementById('previewB');
  if (!data || Object.keys(data).length===0) {
    b.innerHTML = '<div class="empty">En attente...</div>';
    return;
  }
  const n = (data.npcs||[]).length, q = (data.quests||[]).length;
  setPreviewTitle(`Apercu JSON — ${n} PNJ, ${q} quete(s)`);
  b.innerHTML = '<pre>'+esc(JSON.stringify(data,null,2))+'</pre>';
  b.scrollTop = b.scrollHeight;
}

function setPreviewTitle(t) { document.getElementById('previewH').textContent = t; }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function saveJSON() {
  const data = currentData || currentDim;
  if (!data || !data.meta?.id) { showToast('Pas de donnees a sauver','err'); return; }
  try {
    const r = await fetch(`/api/dimensions/${data.meta.id}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    });
    if (!r.ok) throw new Error('Save failed');
    showToast(`Sauve: ${data.meta.id}`,'ok');
  } catch(e) { showToast('Erreur: '+e.message,'err'); }
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Init
document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
switchTab('create');
</script>
</body>
</html>
